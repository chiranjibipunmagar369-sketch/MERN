<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>loading animation</title>
    <style>
        .container{
            height: 100vh;
            width: 100%;
        }
        .box{
            height: 60px;
            width: 60px;
            border: 7px solid red;
            border-right: 7px solid white;
            border-radius: 50%;
            animation: loader 0.4s linear infinite;
        }
        
        @keyframes loader {
            from{

            }
            to{
                transform: rotate(360deg);
            }
            
        }
        @keyframes loader {
            0%{
                transform: rotate(0);
            }
            25%{
                transform: rotate(0.25 turn);
            }
            40%{
                transform: rotate(0.75turn);
            }
            60%{
                    transform: rotate(0.6 turn);
            }
            80%{
                    transform: rotate(0.8 turn);
            }
            100%{
                transform: rotate(1 turn);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            
        </div>
        <div class=" box box1">

        </div>
    </div>
</body>
</html>

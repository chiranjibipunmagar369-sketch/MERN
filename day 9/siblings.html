<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sidebar in html</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .container {
        height: 100vbh;
        width: 100%;
      }
      .box {
        background-color: red;
        height: 100px;
        width: 100px;
        margin: 5px;
      }
      .box1 ~ .box2 {
        background-color: green;
        border-radius: 20%;
      }
    </style>
  </head>
  <body>
    <div class="container">
        <div class="box box1"></div>
        <div class="box3"></div>
        <div class="box box2"></div>
    </div>
  </body>
</html>

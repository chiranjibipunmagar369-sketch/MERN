<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>id and class</title>
    <style>
        #first{
            color: red;
        }
        .red{
            background-color: green;
        }
        #yellow{
            background-color: yellow;
        }
    </style>
</head>
<body>
    <!-- id ,class -->
     <div id="first"> 
        <H2>
            this is for id
        </H2>
        <p>
            Lorem ipsum dolor sit amet consectetur adipisicing elit. Laborum suscipit velit dolor!
        </p>
     </div>
     <div class="red"><h1>hello this is me</h1></div>
     <div class="red"><h1>hello this is me</h1></div>
     <div class="red"><h1>hello this is me</h1></div>
     <div class="red"><h1>hello this is me</h1></div>
     <div id="yellow"><h1>hello this is me</h1></div>
     
     
     
</body>
</html>

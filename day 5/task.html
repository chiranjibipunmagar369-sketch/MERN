<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>task</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing:border-box ;
        }
        body{
            margin: 20px;
        }
        .container{
            border: 2px solid blue;
            width: 500px;
            border-radius: 20px;
            padding: 20px;
        }
        .box1 {
            margin: 20px;
            height: 200px;
            width: 400px;
            border: 2px solid blue;
            border-radius: 20px;
            object-fit: cover;
        }
        .circle{
            height: 100px;
            width: 100px;
            border-radius: 100%;
            border: 2px solid blue;
        }
        .hero{
            height: 130px;
            display: flex;
            justify-content: space-around;
            gap: 15px;
            margin-top: 20px;
            

            /* border: 2px solid; */
        }
        .name{
            height: 90px;
            width: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 2px solid blue;
            /* padding: 20px; */
            border-radius: 20px;
        }
        
        .box3{
            margin: 30px;
            padding: 20px;
            border: 2px solid blue;
            border-radius: 20px;
        }
        .button{
            height: 50px;
            width: 100px;
            display: block;
            margin: auto;
            border: 2px solid blue;
            border-radius: 20px;

        }
    </style>
</head>
<body>
    <div class="container">

        <div>
            <img src="football.jpg" alt="football image" class="box1">
        </div>
        <section class="hero">
    
            <div class="name" >
                <h1><span>FOOTBALL</span></h1>
            </div>
            <div><img src="football.jpg" alt="me" class="circle"> </div>
        </section>
            <div class="box3">
                <p>Football is the greatest sport in the World. All people in the world love football and play football. Leo Messi is the GOAT of football. After him is Cristiano Ronaldo.
                </p>
            </div>
        <div>
            <button class="button">get my info</button>
        </div>
    </div>
</body>
</html>

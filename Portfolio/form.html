<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact form</title>
</head>
<body>
    <form action="formsubmit.html" method="get" >
        <div>
            <label for="fname">First name:</label>
            <input type="text" id="fname" name="fname">
        </div>
        <div>
            <p>*optional</p>
            <label for="sname">Surname:</label>
            <input type="text" id="sname" name="sname">
        </div>
        <div>
            <label for="lname">Last name:</label>
            <input type="text" id="lname" name="lname">
        </div>
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
        </div>
        <div>
            <label for="male">Male:</label>
            <input type="radio" id="male" name="gender">
            <label for="female">Female:</label>
            <input type="radio" id="female" name="gender">
        </div>
        <div>
          <label for="edu">Education:</label>
          <select name="edu" id="edu">
            <option value="edu">Your education</option>
            <option value="">Masters completed</option>
            <option value="">Masters running</option>
            <option value="">Bachelors completed</option>
            <option value="">Bachelors running</option>
            <option value="">+2 completed</option>
          </select>
        </div>
        <div>
            <label for="country">Country:</label>
            <select name="country" id="Country">
                <option value="country">Country</option>
                <option value="nepal">Nepal</option>
                <option value="india">India</option>
                <option value="aus">Australia</option>
            </select>
        </div>
        <div>
            <label for="check">Select projects:</label>
            landing page
            <input type="checkbox" id="check">
            Portfolio Design
            <input type="checkbox" id="check">
            UI UX Design
            <input type="checkbox" id="check">
            Website
            <input type="checkbox" id="check">
        </div>
            <input type="submit" value="submit your form">
    </form>
</body>
</html>

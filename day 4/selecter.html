<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="style.css">
      -->
    <style>

        div{
            color: blue;

        }
        h1{
            color: green;
        }
        body{
            text-align: center;
        }
        /* class selecter */
        .red{
            color:red;
        }
        .purple{
            color:purple;
        }
        /* id selectoor */
        #hello{color: red;}
        /* universal selecter */
        /* *{
            background-color: purple;
        } */
        /* pseudo selector */
        a:link{
            color:red;
        }
        a:visited{
            color: purple;
        }
        a:hover{
            color: black;
        }
    </style>
</head>
<body>
    <p >Lorem ipsum dolor sit amet.</p>
    <div>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Natus temporibus odit ab?</div>
    <h1>fsdfdsf</h1>
    <h1 class="red">dsfdsf</h1>
    <h1 class="purple">dsfdsf</h1>
    <h1 id="hello"">hello</h1>
    <a href="www.google.com">google</a>
</body>
</html>
